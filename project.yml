name: TabiRoute
options:
  bundleIdPrefix: jp.co.texia
  deploymentTarget:
    iOS: "17.0"
packages:
  RouteClusteringKit:
    path: Packages/RouteClusteringKit
targets:
  TabiRoute:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TabiRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.texia.tabiroute
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TabiRoute/Info.plist
    dependencies:
      - package: RouteClusteringKit
schemes:
  TabiRoute:
    build:
      targets:
        TabiRoute: all
    run:
      config: Debug
    test:
      config: Debug
